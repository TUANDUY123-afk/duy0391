      .heart-particle {
        position: absolute;

          opacity: 0;
        }
      }

        background-size: contain;
        background-repeat: no-repeat;
        width: 25px;
        height: 25px;
        top: -5%;
        opacity: 0;
        animation: fall 10s linear infinite;
      }
      @keyframes fall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }

          opacity: 0;
        }
      }
